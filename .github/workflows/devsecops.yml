name: Automatisation des tests DevSecOps

on:
  push:

jobs:

  Dependances:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4

      - name: Dependances
        run: |
          echo "Contrôle des dépendances"

  Dockerfile:
  runs-on: ubuntu-latest
  needs: Dependances

  steps:
    - name: Checkout du repository
      uses: actions/checkout@v4

    - name: Scan du Dockerfile avec Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'config'
        scan-ref: 'Dockerfile'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile

    steps:
      - name: Scan des dépendances avec Trivy
  uses: aquasecurity/trivy-action@v0.36.0
  with:
    scan-type: 'fs'
    scan-ref: '.'
    scanners: 'vuln'
    severity: 'HIGH,CRITICAL'
    exit-code: '1'
